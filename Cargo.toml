[package]
name = "stynps-playselect"
version = "0.1.1"
edition = "2021"
description = "A modern, high-performance Linux controller remapper for DualShock 4 and DualSense (PS5)."
license = "MIT"

[dependencies]
# UI Dependencies
eframe = { version = "0.28.1", features = ["persistence"] }
egui = "0.28.1"
# THIS IS THE FIX: Added all_loaders so egui can read the PNGs
egui_extras = { version = "0.28.1", features = ["all_loaders"] }

# Serialization & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Backend & System Dependencies
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
evdev = { version = "0.12", features = ["tokio"] }
x11rb = "0.13"
dirs = "5.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
